<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pos 2: Minat Bakat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="bg-green-700 text-white p-4 rounded-t-lg shadow-md flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">Pos 2: Minat Bakat</h1>
            <a href="index.html" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded text-sm font-semibold transition">Menu Utama</a>
        </header>

        <section class="bg-white p-6 rounded-b-lg shadow-md">
            
            <div class="bg-green-50 p-4 border border-green-200 rounded-md mb-6">
                <label class="block text-sm font-bold text-green-900 mb-2">Cari Pendaftar (NISN)</label>
                <div class="flex gap-2">
                    <input type="text" id="cek_nisn" class="border border-gray-300 p-2 rounded w-full focus:ring-2 focus:ring-green-500 outline-none" placeholder="Masukkan NISN pendaftar...">
                    <button type="button" onclick="setNisn()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 font-semibold shadow transition whitespace-nowrap">Pilih</button>
                </div>
            </div>

            <div id="formSection" style="display: none;">
                <div class="bg-yellow-50 text-yellow-800 p-3 rounded mb-6 text-sm font-semibold border border-yellow-200">
                    Mengisi untuk Pendaftar (NISN): <span id="display_nisn" class="font-bold text-black bg-yellow-200 px-2 py-1 rounded"></span>
                </div>

                <form id="formMinatBakat" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tinggi Badan (cm) <span class="text-red-500">*</span></label>
                        <input type="number" id="tinggi" class="w-full border border-gray-300 p-3 rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Berat Badan (kg) <span class="text-red-500">*</span></label>
                        <input type="number" id="berat" class="w-full border border-gray-300 p-3 rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Lingkar Kepala (cm) <span class="text-red-500">*</span></label>
                        <input type="number" step="0.1" id="lingkar_kepala" class="w-full border border-gray-300 p-3 rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tes Buta Warna <span class="text-red-500">*</span></label>
                        <select id="buta_warna" class="w-full border border-gray-300 p-3 rounded bg-white">
                            <option value="Tidak">Tidak Buta Warna</option>
                            <option value="Ya">Ya (Buta Warna)</option>
                        </select>
                    </div>
                    
                    <div class="pt-4">
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 shadow-md text-lg">Simpan Data Minat Bakat</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script>
        // ======= KONFIGURASI SUPABASE ========
        const SUPABASE_URL = '';
        const SUPABASE_ANON_KEY = '';
        let supabaseClient = null;
        let useSupabase = false;
        if (SUPABASE_URL !== '') { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); useSupabase = true; }
        // =====================================

        let currentNisn = '';

        function setNisn() {
            const inputNisn = document.getElementById('cek_nisn').value.trim();
            if(!inputNisn) {
                alert("Masukkan NISN pendaftar!"); return;
            }
            currentNisn = inputNisn;
            document.getElementById('display_nisn').innerText = currentNisn;
            document.getElementById('formSection').style.display = 'block';
        }

        document.getElementById('formMinatBakat').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payload = {
                nisn: currentNisn,
                tinggi: document.getElementById('tinggi').value,
                berat: document.getElementById('berat').value,
                lingkar_kepala: document.getElementById('lingkar_kepala').value,
                buta_warna: document.getElementById('buta_warna').value,
            };

            if(useSupabase) {
                const { error } = await supabaseClient.from('pendaftar').upsert(payload);
                if(error) { alert("Gagal simpan ke DB"); return; }
            } else {
                let dbLokal = JSON.parse(localStorage.getItem('db_spmb_v2')) || {};
                dbLokal[currentNisn] = { ...dbLokal[currentNisn], ...payload };
                localStorage.setItem('db_spmb_v2', JSON.stringify(dbLokal));
            }
            
            alert("Input data Minat Bakat (Pos 2) selesai disimpan!");
            document.getElementById('formMinatBakat').reset();
            document.getElementById('cek_nisn').value = '';
            document.getElementById('formSection').style.display = 'none';
        });
    </script>
</body>
</html>
